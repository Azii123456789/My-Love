<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message for My Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aesthetic-bg">
        <div class="animated-blobs">
            <div class="heart-bg"></div>
            <div class="bg-hearts"></div>
            <div class="blob blob1"></div>
            <div class="blob blob2"></div>
            <div class="blob blob3"></div>
        </div>
        <div class="floating-hearts"></div>
        <div class="glass-card">
            <div class="heart-icon">❤️</div>
            <div class="message-box">
                <p id="message">Hi, Love <span class="emoji">❤️</span><br><br>I know today isn’t a special day, but you are. I just want to say thank you for being patient with me, caring for me, and loving me. I appreciate you more than I can explain. I love you, always.</p>                <div class="song-section">
                    <div class="music-note-icon">♪</div>
                    <p class="song-title">Here With Me</p>
                    <div class="audio-player-wrapper">
                        <div class="equalizer">
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                        </div>
                        <!-- animated waveform bars (static image removed) -->
                        <div class="waveform equalizer">
                            <!-- 25 bars for waveform animation -->
                            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
                            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
                            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
                            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
                            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        </div>
                        <audio controls autoplay class="custom-audio">
                            <source src="here with me.mp3" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                </div>            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
